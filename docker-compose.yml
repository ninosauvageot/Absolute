services:
    web:
        container_name: absolute-web
        image: nginx:latest
        volumes:
            - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
            - ./app:/app
            - ./logs:/logs
            - chat-build:/app/js/chat
        depends_on:
            - mysql
            - php
            - chat
        networks:
            - absolute
            - proxy
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=proxy"
            - "traefik.http.routers.absolute.rule=Host(`pokemon.sauva.internal`)"
            - "traefik.http.routers.absolute.entrypoints=web"
            - "traefik.http.routers.absolute.service=absolute"
            - "traefik.http.services.absolute.loadbalancer.server.port=80"

    mysql:
        container_name: absolute-mysql
        image: mariadb:10.7
        env_file:
            - .env
        environment:
            MARIADB_AUTO_UPGRADE: 1
        volumes:
            - absolute-mysqldata:/var/lib/mysql
            - ./.env:/data/application/.env
            - ./config/my.cnf:/etc/mysql/my.cnf
            - ./migrations/sql:/data/application/sql
            - ./migrations/migrate.sh:/data/application/migrate.sh
        command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
        healthcheck:
            test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -u$$MYSQL_ROOT_USER -p$$MYSQL_ROOT_PASSWORD --silent"]
            interval: 5s
            timeout: 5s
            retries: 20
            start_period: 20s
        networks:
            - absolute

    phpmyadmin:
        container_name: absolute-phpmyadmin
        image: phpmyadmin:latest
        environment:
            PMA_HOST: mysql
            PMA_ABSOLUTE_URI: '/db/'
            UPLOAD_LIMIT: 512M
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - absolute

    php:
        container_name: absolute-php
        build:
            context: .
            dockerfile: dockerfiles/absolute.dockerfile
        env_file:
            - .env
        volumes:
            - ./app:/app
            - ./logs:/logs
            - ./migrations:/migrations:ro
            - ./config/opcache.ini:/usr/local/etc/php/conf.d/opcache.ini
            - ./config/xdebug.ini:/usr/local/etc/php/conf.d/docker-php-ext-xdebug.ini
            - ./config/error_reporting.ini:/usr/local/etc/php/conf.d/error_reporting.ini
        extra_hosts:
            - "host.docker.internal:host-gateway"
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - absolute

    chat:
        container_name: absolute-chat
        restart: on-failure
        init: true
        build:
            context: .
            dockerfile: dockerfiles/chat.dockerfile
        environment:
            DATABASE_HOST: ${MYSQL_HOST}
            DATABASE: ${MYSQL_GAME_DATABASE}
            DATABASE_TABLE: ${MYSQL_GAME_DATABASE}
            DATABASE_USER: ${MYSQL_USER}
            DATABASE_PASSWORD: ${MYSQL_PASSWORD}
            BOT_NAME: Absolute
            BOT_COLOR: "#4A618F"
            BOT_LOG_CHANNEL: Absolute-Bot-Logs
            BOT_DEPLOY_COMMANDS: "true"
            CHAT_ALLOWED_ORIGIN: "http://pokemon.sauva.internal"
        volumes:
            - chat-build:/chat/build/client
        depends_on:
            mysql:
                condition: service_healthy
        networks:
            - absolute

volumes:
    absolute-mysqldata: {}
    chat-build: {}

networks:
    absolute:
        name: absolute
        driver: bridge

    proxy:
        external: true
