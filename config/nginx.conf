server {
    listen 80;
    listen [::]:80;

    server_name pokemon.sauva.internal;
    server_tokens off;

    root /app;
    index index.php;

    error_page 403 /403.php;
    error_page 404 /404.php;
    error_page 500 /500.php;

    # Pokemon icons and sprites
    location ~* ^/sprites/pokemon/icons/(.+?)/(.+)$ {
        try_files /sprites/pokemon/icons/$1/$2 /sprites/pokemon/icons/normal/$2 =404;
    }

    location ~* ^/sprites/pokemon/(.+?)/(.+)$ {
        try_files /sprites/pokemon/$1/$2 /sprites/pokemon/normal/$2 =404;
    }

    # Socket.IO chat
    location /socket.io/ {
        proxy_pass http://chat:8080;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # React exploration client entrypoint.
    # Keep the legacy PHP index untouched while making /adventure/ directly usable.
    location = /adventure/ {
        try_files /adventure/index.html =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location /js/ {}

    # Deny access to chat source
    location ~ /(node|absol|absolute)/ {
        deny all;
    }

    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
    }

    # Static file cache
    location ~* \.(?:jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|css|js)$ {
        expires 1h;
        add_header Cache-Control "public";
    }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_pass php:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # URL rewrites
    rewrite /user/([A-Za-z0-9_]+)$ /profile.php?id=$1 last;

}
